<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in | WorldLab: Green Frontier</title>
<meta name="description" content="Log in to your WorldLab farm.">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0b1210">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=d20cd99018">
<script src="config.js?v=d20cd99018"></script>
</head>
<body class="authpage">
<main class="auth-shell">
  <a class="logo" href="./"><img src="favicon.svg" alt="" width="30" height="30">WorldLab<span class="logo-sub">Green Frontier</span></a>
  <form class="card auth-form" id="authForm" data-mode="login" novalidate>
    <h1>Log in</h1>
    <p class="sub">Back to your farm near Al Ain.</p>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p class="err" id="err" role="alert" hidden></p>
    <button class="btn solid big" type="submit" id="submit">Log in</button>
    <p class="swap">New here? <a href="signup" id="swapLink">Create an account</a></p>
  </form>
  <p class="aside">No account needed to <a href="demo">watch a recorded season</a>.</p>
</main>
<script type="module" src="site.js?v=d20cd99018"></script>
</body>
</html>
