<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in to WorldLab: Green Frontier</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=b2e635c2ae">
<script src="config.js?v=b2e635c2ae"></script>
</head>
<body class="authpage">
<main class="auth-shell">
  <a class="logo" href="./"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><path d="M10 21c0-7 5-11 12-11-1 7-5 11-12 11Zm0 0 6-6" fill="none" stroke="var(--emerald)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>WorldLab<span class="logo-sub">Green Frontier</span></a>
  <form class="card auth-form" id="authForm" data-mode="login" novalidate>
    <h1>Log in</h1>
    <p class="sub">Back to your farm near Al Ain.</p>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p class="err" id="err" role="alert" hidden></p>
    <button class="btn solid big" type="submit" id="submit">Log in</button>
    <p class="swap">New here? <a href="signup" id="swapLink">Create an account</a></p>
  </form>
  <p class="aside">No account needed to <a href="demo">watch a recorded season</a>.</p>
</main>
<script type="module" src="site.js?v=b2e635c2ae"></script>
</body>
</html>
