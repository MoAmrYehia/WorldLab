# Tests the code, regenerates the static website from its canonical sources (worldlab/site, worldlab/dashboard),
# checks it in a real browser, then publishes it to the gh-pages branch, which GitHub Pages serves.
# If the repository variable HF_SPACE is set (for example moamryehia/worldlab), the site is pointed at
# that Space's server; WORLDLAB_SERVER overrides it with any address.
name: Publish website
on:
  push:
    branches: [main]
    paths: ["docs/**", "worldlab/**", "scripts/**", "tests/**", "requirements.txt", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the Python tests
        run: |
          pip install --quiet -r requirements.txt pytest
          python -m pytest -q tests/
      - name: Regenerate the static site from canonical sources
        run: |
          python scripts/build_site_data.py
          python scripts/build_artifact.py docs
          test -s docs/index.html && test -s docs/app/index.html && test -s docs/app/replay.json
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Browser checks on the generated site
        timeout-minutes: 10
        run: |
          npm install --no-save --silent playwright@1.48.2
          npx playwright install --with-deps chromium
          (python -m http.server -d docs 8811 >/dev/null 2>&1 &)
          sleep 2
          node tests/browser/smoke.js http://127.0.0.1:8811
      - name: Prepare the site
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
          WORLDLAB_SERVER: ${{ vars.WORLDLAB_SERVER }}
        run: |
          mkdir site && cp -r docs/. site/ && rm -rf site/bench site/DEMO.md && touch site/.nojekyll
          server="$WORLDLAB_SERVER"
          if [ -z "$server" ] && [ -n "$HF_SPACE" ]; then
            server="https://$(echo "$HF_SPACE" | tr '[:upper:]' '[:lower:]' | sed 's#/#-#; s#[_.]#-#g').hf.space"
          fi
          if [ -n "$server" ]; then
            sed -i "s#var SERVER = \".*\";#var SERVER = \"${server}\";#" site/config.js
          fi
          grep -m1 "var SERVER" site/config.js
      - name: Push to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.email "actions@users.noreply.github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -qm "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
