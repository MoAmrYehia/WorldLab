<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join WorldLab</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body class="authpage">
<main class="auth-shell">
  <a class="logo" href="./"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14.5" fill="none" stroke="var(--emerald)" stroke-width="1.6"/><path d="M10 21c0-7 5-11 12-11-1 7-5 11-12 11Zm0 0 6-6" fill="none" stroke="var(--emerald)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>WorldLab<span class="logo-sub">Green Frontier</span></a>
  <form class="card auth-form" id="authForm" data-mode="signup" novalidate>
    <h1>Create your account</h1>
    <p class="sub">You get your own farm: six fields, ten crops, one growing year.</p>
    <label for="name">Name</label>
    <input id="name" name="name" autocomplete="name" required maxlength="80">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" aria-describedby="pwHint">
    <p class="hint" id="pwHint">At least 8 characters.</p>
    <p class="err" id="err" role="alert" hidden></p>
    <button class="btn solid big" type="submit" id="submit">Create account</button>
    <p class="swap">Already have an account? <a href="login" id="swapLink">Log in</a></p>
  </form>
  <p class="aside">No account needed to <a href="demo">watch a recorded season</a>.</p>
</main>
<script type="module" src="site.js"></script>
</body>
</html>
